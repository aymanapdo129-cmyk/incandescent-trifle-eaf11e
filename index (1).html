<div class="modal" id="modal">
<div class="box">
<button class="close" onclick="closeModal()">×</button>
<h2 id="pname">المنتج</h2>
<p>السعر: <b class="gold" id="price"></b> جنيه</p>
<b>اختر اللون</b><div class="opts" id="colors"></div>
<b>اختر المقاس</b><div class="opts" id="sizes"></div>
<div id="form">
<div class="grid">
<div class="field"><label>الاسم بالكامل *</label><input id="name"></div>
<div class="field"><label>رقم الهاتف *</label><input id="phone"></div>
<div class="field"><label>المحافظة *</label><input id="gov"></div>
<div class="field"><label>الكمية *</label><input id="qty" type="number" min="1" value="1"></div>
<div class="field full"><label>العنوان بالتفصيل *</label><textarea id="address"></textarea></div>
</div>
<button class="send" onclick="sendOrder()">اطلب الآن</button>
</div>

</div>
</div>

<script>
let state={};
const colors=['أسود','أبيض','رمادي','كحلي','زيتي','بيج'],sizes=['S','M','L','XL','XXL'];
function openProduct(n,p){
 state={name:n,price:p,color:'أسود',size:'M'};
 pname.textContent=n;price.textContent=p;
 makeOptions(colors,'colors','color');makeOptions(sizes,'sizes','size');
 form.style.display='block';done.classList.remove('show');modal.classList.add('open');
}
function makeOptions(arr,id,key){
 const box=document.getElementById(id);box.innerHTML='';
 arr.forEach((v,i)=>{const b=document.createElement('button');b.className='opt'+(i===0?' sel':'');b.textContent=v;
 b.onclick=()=>{box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');state[key]=v};box.appendChild(b)})
}
function closeModal(){modal.classList.remove('open')}
function sendOrder(){
 if(!name.value.trim()||!phone.value.trim()||!gov.value.trim()||!address.value.trim()){alert('من فضلك أكمل بيانات الطلب');return}
 const no='F5M-'+Date.now().toString().slice(-7);
 const orders=JSON.parse(localStorage.getItem('f5m_orders')||'[]');
 orders.push({no,customer:name.value,phone:phone.value,gov:gov.value,address:address.value,qty:qty.value,product:state,status:'جديد',created:new Date().toISOString()});
 localStorage.setItem('f5m_orders',JSON.stringify(orders));
 form.style.display='none';orderNo.textContent='رقم الطلب: '+no;done.classList.add('show');
}
</script>
