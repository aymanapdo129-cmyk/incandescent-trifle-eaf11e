<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F5M | Premium Sportswear</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:32px;font-weight:900;letter-spacing:3px}.wa{background:#25d366;color:#07140b;text-decoration:none;font-weight:800;padding:12px 18px;border-radius:12px}

.products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:18px}
.pic{height:180px;border-radius:14px;background:linear-gradient(145deg,#333,#111);display:flex;align-items:center;justify-content:center;font-size:54px}
.card h3{margin:14px 0 7px}.price{font-size:20px;font-weight:bold;margin-bottom:12px}
button{width:100%;border:0;border-radius:10px;padding:12px;background:#fff;color:#000;font-weight:800;font-size:16px}
.note{text-align:center;color:#999;margin:24px 0}@media(max-width:600px){.products{grid-template-columns:1fr}.hero h1{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">

<a class="wa" href="https://wa.me/201025543017?text=مرحباً%20F5M%20أريد%20الطلب" target="_blank">اطلب الآن عبر واتساب</a>
</section>
<section class="products">
<div class="card"><div class="pic">👕</div><h3>F5M T-Shirt</h3><div class="price">799 جنيه</div><button onclick="order('F5M T-Shirt',799)">اطلب المنتج</button></div>

</section>
<div class="note">خدمة العملاء والطلبات: 01025543017</div>
</div>
<script>
function order(name,price){location.href='https://wa.me/201025543017?text='+encodeURIComponent('مرحباً F5M\\nأريد طلب: '+name+'\\nالسعر: '+price+' جنيه')}
